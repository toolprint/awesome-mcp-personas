name: intern
description: Entry-level persona with essential tools for basic development, file management, web requests, and data persistence - perfect for learning the ropes
version: "1.0"
toolsets:
  - name: file-and-version-control
    description: >
      Basic file management and version control operations for everyday development tasks.
      Examples: read project files, track changes, commit work, explore directory structure.
    toolIds:
      - filesystem.read_text_file
      - filesystem.write_file
      - filesystem.list_directory
      - filesystem.create_directory
      - git.git_status
      - git.git_add
      - git.git_commit
      - git.git_diff
      - git.git_log
  
  - name: research-and-learn
    description: >
      Explore external APIs and documentation while building persistent knowledge about what you discover.
      Examples: research API endpoints and store findings, fetch documentation and remember key insights, map external services to internal components.
    toolIds:
      - fetch.fetch
      - fetch.get
      - fetch.post
      - memory.create_entities
      - memory.add_observations
      - memory.search_nodes
  
  - name: codebase-discovery
    description: >
      Explore project structure and build persistent understanding of how components relate to each other.
      Examples: browse directories and remember architecture, read code files and map relationships, track git history and connect code to people.
    toolIds:
      - filesystem.list_directory
      - filesystem.read_text_file
      - git.git_log
      - git.git_status  
      - git.git_branch
      - memory.create_entities
      - memory.add_observations
      - memory.search_nodes
  
  - name: context-building
    description: >
      Build comprehensive project knowledge by combining file analysis, git investigation, and persistent knowledge storage.
      Examples: analyze project files and store component info, track team contributions and map responsibilities, build searchable project knowledge base.
    toolIds:
      - filesystem.read_text_file
      - filesystem.write_file
      - git.git_log
      - git.git_diff
      - memory.create_entities
      - memory.add_observations
      - memory.read_graph

defaultToolset: file-and-version-control

metadata:
  author: Awesome MCP Personas Contributors
  tags:
    - getting-started
    - basic
    - essential
    - beginner-friendly
    - multipurpose
