name: postgresql-dba
description: Production PostgreSQL database administrator persona focused on enterprise PostgreSQL operations, performance monitoring, schema management, and production DBA workflows with advanced PostgreSQL-specific tooling for optimization, maintenance, and compliance.
version: "1.0"

toolsets:
  - name: production-admin
    description: Core PostgreSQL administration and monitoring for production environments
    toolIds:
      - postgres.execute_query
      - postgres.list_tables
      - postgres.describe_table
      - postgres.get_schema
      - postgres.list_users
      - postgres.check_permissions
      - postgres-ops.monitor_connections
      - postgres-ops.check_vacuum_stats
      - postgres-ops.get_table_stats
      - postgres-ops.monitor_replication
      - postgres-ops.check_bloat

  - name: performance-tuning
    description: PostgreSQL query optimization and database performance analysis
    toolIds:
      - postgres.analyze_query
      - postgres.explain_query
      - postgres.get_stats
      - postgres-ops.analyze_slow_queries
      - postgres-ops.get_index_usage
      - postgres-ops.check_lock_waits
      - postgres-ops.monitor_autovacuum
      - chart.create_line_chart
      - chart.create_bar_chart
      - vchart.create_performance_dashboard
      - time.get_current_time
      - time.convert_timezone

  - name: development-ops
    description: Schema management, migrations, and development workflow support
    toolIds:
      - filesystem.read_text_file
      - filesystem.write_file
      - filesystem.list_directory
      - filesystem.create_directory
      - git.git_status
      - git.git_add
      - git.git_commit
      - git.git_diff
      - memory.create_entities
      - memory.search_nodes
      - memory.add_observations
      - postgres-ops.validate_schema
      - postgres-ops.generate_migration

  - name: monitoring-alerts
    description: Real-time monitoring, alerting, and capacity planning
    toolIds:
      - postgres-ops.check_disk_usage
      - postgres-ops.monitor_cpu_usage
      - postgres-ops.check_connection_limits
      - postgres-ops.monitor_backup_status
      - postgres-ops.get_error_log
      - postgres-ops.check_security_audit
      - postgres-ops.validate_configuration
      - chart.create_time_series
      - vchart.create_alert_dashboard
      - memory.read_graph
      - time.format_time
      - time.calculate_duration

defaultToolset: production-admin

metadata:
  author: MCP Persona Registry
  tags:
    - database
    - postgresql
    - dba
    - production
    - performance
    - monitoring
    - administration
    - enterprise
  created: "2025-08-26T12:30:00Z"
  lastModified: "2025-08-26T12:30:00Z"